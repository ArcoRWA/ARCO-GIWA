name: Contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    name: Compile and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack yarn install --immutable
      - run: corepack yarn compile
      - name: Core contracts (ArcoUSD, Reserve, Router, Savings, Funds vaults, price feeds, ArcoGOLD)
        run: corepack yarn test:core
      - name: Stocks contracts (isolated local config)
        run: corepack yarn test:stocks
